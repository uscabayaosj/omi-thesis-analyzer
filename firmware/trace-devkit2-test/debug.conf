CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PROCESS_THREAD_PRIORITY=5
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
# This image validates live BLE only. Skipping SD mount avoids blocking BLE
# startup on a missing or unresponsive card and leaves card contents untouched.
CONFIG_OMI_ENABLE_OFFLINE_STORAGE=n
# The button service is unrelated to BLE audio and is omitted from this test.
CONFIG_OMI_ENABLE_BUTTON=n
# Avoid starting optional output hardware before the live capture transport.
CONFIG_OMI_ENABLE_SPEAKER=n
CONFIG_OMI_ENABLE_HAPTIC=n
CONFIG_OMI_ENABLE_USB=n
