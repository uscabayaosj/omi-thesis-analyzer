<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="leaflet.css"><style>html,body,#map{height:100%;margin:0}</style></head><body><div id="map" aria-label="Conversation location map"></div><script src="leaflet.js"></script><script>
const map=L.map('map').setView([0,0],15);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
let marker,editing=false;function report(){const p=marker.getLatLng();window.webkit.messageHandlers.pin.postMessage({latitude:p.lat,longitude:p.lng});}
function setPin(lat,lon,edit){editing=edit;if(!marker){marker=L.marker([lat,lon],{draggable:edit}).addTo(map);marker.on('dragend',report);map.setView([lat,lon],15);}else if(!marker.getLatLng().equals([lat,lon])){marker.setLatLng([lat,lon]);map.panTo([lat,lon]);}if(edit)marker.dragging.enable();else marker.dragging.disable();}
map.on('click',e=>{if(editing){marker.setLatLng(e.latlng);report();}});
</script></body></html>
